name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest

    env:
      DLP_DB_DSN: postgresql://dlp:dlp@localhost:5432/dlp

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dlp
          POSTGRES_PASSWORD: dlp
          POSTGRES_DB: dlp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # proto/dlp.proto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate proto stubs
        run: python scripts/gen_proto.py

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Apply DB schema
        run: python scripts/apply_schema.py

      - name: Pytest
        run: pytest -q
