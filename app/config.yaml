fail_action: block
soft_budget_sec: 2.5

session_ttl_sec: 1800
vault_ttl_sec: 1800
log_path: log_events.jsonl

db:
  dsn: postgresql://dlp:dlp@localhost:5432/dlp
  pool_min: 1
  pool_max: 8

purpose:
  backend: rule
  llm_timeout_sec: 1.5

risk:
  hard_block: 0.8

guardrail:
  injection_threshold: 0.7

detect:
  regex_min_confidence: 0.5
  dict_min_confidence: 0.0
  ner_threshold: 0.55                      # 실측 기준 임시값, eval로 튜닝 예정
  ner_model_name: urchade/gliner_multi-v2.1
  merge_overlap_bonus: 0.02
  dictionary_path: ""
  enabled_layers: ""

grpc:
  host: 0.0.0.0
  port: 50051

api:
  host: 0.0.0.0
  port: 8000